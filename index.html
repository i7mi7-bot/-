<style>

<body>
<main class="poster" aria-labelledby="poster-title">
<h1 id="poster-title" class="sr-only">纵使相逢应不识</h1>
<p class="sr-only">记忆的消逝。六栋依照线稿排列的粒子房屋，灰绿色浓墨在宣纸上柔化晕散，房屋相交处积墨变深，细小颗粒持续不规则漂移。鼠标划过或停留时，粒子向外大幅洇开，局部墨色被持续稀释；移开后不恢复，洇开的墨粒缓慢下落并留下水痕。</p>
<canvas id="scene" aria-hidden="true"></canvas>
</main>
<p class="help">右键切换配色 · S 保存当前帧 · 刷新重新开始</p>
<div class="notice" id="notice" role="status" aria-live="polite"></div>

function updateFlow(time){

 }
}
function displacement(p){

const batches=Array.from({length:18},()=>[]);

const maskCtx=mask.getContext('2d'),maskPixels=maskCtx.createImageData(WW,WH);

let simulationTime=0;

function pointerLeave(){pointer.active=false;pointer.dwell=0;}
canvas.addEventListener('pointermove',pointerMove,{passive:true});

 const crisp=sc.createImageData(W,H),soft=mc.createImageData(W,H);
 // Selected areas lose their crisp strokes and remain only as diffused ink.
 const patches=[[-16,-15,13],[15,9,15],[-5,15,12],[14,-14,15],[-16,6,12],[10,-12,14],[15,13,14]];
 for(let y=651;y<1100;y++)for(let x=70;x<160;x++){
  const warpX=Math.round(x+(noise(x,y,8,97)-.5)*1.5),warpY=Math.round(y+(noise(x,y,9,98)-.5)*1.5);
  const alpha=original.data[(warpY*W+warpX)*4+3]/255;
  if(!alpha)continue;
  const glyph=clamp(Math.round((y-695)/61),0,6),cy=695+glyph*61,p=patches[glyph];
  const d=((x-115-p[0])**2+(y-cy-p[1])**2)/(p[2]*p[2]);
  const d2=((x-115+p[0]*.5)**2+(y-cy+p[1]*.9)**2)/90;
  const dissolve=clamp(Math.exp(-d*.65)*1.35+Math.exp(-d2)*.55);
  const grain=.88+hash(x,y,112)*.12,i=(y*W+x)*4;
  crisp.data[i]=32;crisp.data[i+1]=42;crisp.data[i+2]=30;
  crisp.data[i+3]=alpha*(1-dissolve)*grain*255;
  soft.data[i]=43;soft.data[i+1]=55;soft.data[i+2]=38;
  soft.data[i+3]=alpha*(.10+dissolve*.9)*255;
 }
 sc.putImageData(crisp,0,0);mc.putImageData(soft,0,0);
 fixed.save();fixed.filter='blur(4.2px)';fixed.globalAlpha=.56;fixed.drawImage(mist,0,0);
 fixed.filter='blur(1.7px)';fixed.globalAlpha=.55;fixed.drawImage(mist,0,0);
 fixed.filter='none';fixed.globalAlpha=1;fixed.drawImage(sharp,0,0);fixed.restore();
 fixed.textAlign='center';fixed.textBaseline='middle';
 fixed.font='16px "Songti SC","SimSun","Noto Serif CJK SC",serif';fixed.fillStyle='#59664b';
 [...'记忆的消逝'].forEach((c,i)=>fixed.fillText(c,177,702+i*25));
}
function render(time){
 const dt=clamp(time-simulationTime,0,.12);simulationTime=time;
 updateFlow(preference.matches?0:time);updateWater(dt);
 motion.clearRect(0,0,W,H);
 for(let b=0;b<batches.length;b++){
  const color=['#263623','#3d4b31','#5c6948'][b%3],opacity=[.23,.34,.45][Math.floor((b%9)/3)]*(b<9?1:.50);
  motion.fillStyle=color;
  for(const p of batches[b]){
   advanceParticle(p,dt,time);
   const drift=displacement(p),x=p.x+p.ox+drift[0],y=p.y+p.oy+drift[1];
   if(p.wet>.02&&p.seed<.22){
    const radius=5+p.wet*10;motion.globalAlpha=p.wet*(b<9?.44:.24);motion.drawImage(halo,x-radius,y-radius,radius*2,radius*2);
   }
   motion.globalAlpha=opacity*(1-p.wet*.68);
   const size=p.r*1.7*(1+p.wet*.7);motion.fillRect(x-size/2,y-size/2,size,size*.93);
   if(p.tracer&&p.wet>.1){
    motion.globalAlpha=(b<9?.19:.10)*p.wet;motion.beginPath();motion.ellipse(x,y,1+p.r,2.2+p.r*1.8,0,0,Math.PI*2);motion.fill();
   }
  }
 }
 motion.globalAlpha=1;
 rawCtx.setTransform(dpr,0,0,dpr,0,0);rawCtx.globalCompositeOperation='source-over';rawCtx.drawImage(base,0,0);rawCtx.drawImage(washedPaper,0,0);
 rawCtx.globalCompositeOperation='multiply';rawCtx.drawImage(stains,0,0);rawCtx.filter='blur(0.38px)';rawCtx.drawImage(moving,0,0);rawCtx.filter='none';rawCtx.globalCompositeOperation='source-over';rawCtx.drawImage(typography,0,0);
 presentFrame();
}
function frame(now){
 if(document.hidden){raf=0;lastTime=null;return;}
 if(lastTime!==null)elapsed+=Math.min((now-lastTime)/1000,.1);lastTime=now;
 if(now-lastFrame>=40){render(elapsed);lastFrame=now;}
 raf=(!preference.matches||pointer.active||particles.some(p=>p.wet>.001))?requestAnimationFrame(frame):0;
}
function resize(){dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);rawFrame.width=canvas.width;rawFrame.height=canvas.height;render(elapsed);}
function resume(){if(!raf&&!document.hidden){lastTime=null;raf=requestAnimationFrame(frame);}}
makePaper();makeInk();resize();resume();
addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',resume);
preference.addEventListener('change',()=>{render(elapsed);resume();});
})();
</script>
